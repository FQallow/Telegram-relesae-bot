name: Github Release Monitor -> Telegram
on:
  schedule:
    - cron: '*/3 * * * *'
  workflow_dispatch: # 手动触发

jobs:
  # 第一步：准备工作，读取监控列表，生成 matrix 矩阵
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          # 在这里配置你要监控的仓库列表，支持无限添加
          WATCH_LIST='["Silent1566/webhtv", "Silent1566/webhtv-pc","webhtv/webhtv"]'
          echo "matrix={\"repo\":$WATCH_LIST}" >> $GITHUB_OUTPUT

  # 第二步：并发处理每个仓库
  check-release:
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    env:
      FULL_REPO: ${{ matrix.repo }}
      SKIP_PRERELEASE: "false"
      ALLOW_EXT: ".apk,.exe,.zip,.AppImage"
      GH_PROXY: "https://gh-proxy.com/"
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }} # 强制使用你的 PAT 拉取

      - name: install jq
        run: sudo apt update && sudo apt install -y jq

      # ================= 🚨 新增：纯粹的版本检测 =================
      - name: check version
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          echo "========================================="
          echo "🔍 正在检查仓库: ${FULL_REPO}"
          
          API_URL="https://api.github.com/repos/${FULL_REPO}/releases"
          curl -s -H "Authorization: token $GH_TOKEN" "$API_URL" > releases.json

          if ! jq -e 'type == "array"' releases.json >/dev/null 2>&1; then
            echo "❌ ${FULL_REPO} API 异常"
            echo "SKIP=true" >> $GITHUB_ENV
            exit 0
          fi

          if [ "$SKIP_PRERELEASE" = "true" ]; then
            jq '[.[] | select(.prerelease == false)] | .[0]' releases.json > rel.json
          else
            jq '.[0]' releases.json > rel.json
          fi
          
          tag=$(jq -r '.tag_name // empty' rel.json)
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "⚠️ ${FULL_REPO} 没有找到 Release"
            echo "SKIP=true" >> $GITHUB_ENV
            exit 0
          fi

          SAFE_REPO_NAME=$(echo "$FULL_REPO" | tr '/' '_')
          LAST_TAG_FILE="last_tag_${SAFE_REPO_NAME}.txt"

          if [ -f "$LAST_TAG_FILE" ]; then
            LAST_TAG=$(cat "$LAST_TAG_FILE")
          else
            LAST_TAG=""
          fi

          if [ "$tag" = "$LAST_TAG" ]; then
            echo "⏭️ 版本未更新 ($tag)，直接跳过后续所有步骤。"
            echo "SKIP=true" >> $GITHUB_ENV
            exit 0
          fi

          echo "🚀 发现新版本: $tag"
          echo "SKIP=false" >> $GITHUB_ENV
          
          # 写入环境变量供后续步骤使用
          echo "UPSTREAM_TAG=${tag}" >> $GITHUB_ENV
          SAFE_TAG=$(echo "${FULL_REPO##*/}-${tag}" | tr '/' '-')
          echo "MIRROR_TAG=${SAFE_TAG}" >> $GITHUB_ENV
          echo "MIRROR_NAME=[镜像] ${FULL_REPO} ${tag}" >> $GITHUB_ENV

      # ================= 🚨 新增：只有确实有更新才下载 =================
      - name: download files
        if: env.SKIP != 'true'
        run: |
          echo "开始下载资源..."
          ORIGINAL_BODY=$(jq -r '.body // ""' rel.json)
          {
            echo "## 镜像来源"
            echo "- **上游仓库**: [${FULL_REPO}](https://github.com/${FULL_REPO})"
            echo "- **上游版本**: \`${UPSTREAM_TAG}\`"
            echo ""
            echo "---"
            echo ""
            echo "$ORIGINAL_BODY"
          } > mirror_body.md
          
          echo "MIRROR_BODY_FILE=mirror_body.md" >> $GITHUB_ENV

          IFS=',' read -ra exts <<< "$ALLOW_EXT"
          filter=""
          for e in "${exts[@]}"; do
            if [ -z "$filter" ]; then
              filter="endswith(\"$e\")"
            else
              filter="$filter or endswith(\"$e\")"
            fi
          done

          mkdir -p downloads
          jq -r --arg filter "$filter" \
            '.assets[] | select((.name | $filter) and (.name | test("\\.(json|txt|md)$"; "i") | not)) | .browser_download_url' \
            rel.json > dl_links.txt
          
          download_success=false
          while read -r dl_url; do
            [ -z "$dl_url" ] && continue
            filename=$(basename "$dl_url")
            echo "正在下载: $filename"
            curl -L -s -o "downloads/$filename" "${GH_PROXY}${dl_url}"
            if [ -f "downloads/$filename" ]; then
              download_success=true
            fi
          done < dl_links.txt

          find downloads/ -type f \( -name "*.json" -o -name "*.txt" -o -name "*.md" \) -exec rm -f {} +

          if [ "$download_success" = "false" ] || [ -z "$(ls -A downloads)" ]; then
            echo "⚠️ 没有下载到合规的安装包，跳过。"
            echo "SKIP=true" >> $GITHUB_ENV
            exit 0
          fi
          
          name=$(jq -r '.name // .tag_name' rel.json)
          url=$(jq -r '.html_url' rel.json)
          MSG_FILE=$(mktemp)
          {
            echo "*🚀发现新版本 Release*"
            echo "仓库：\`${FULL_REPO}\`"
            echo "版本：\`${UPSTREAM_TAG}\`"
            echo "标题：${name}"
            echo "[查看原Release页面](${url})"
            echo ""
          } > "$MSG_FILE"
          echo "MSG_FILE_PATH=${MSG_FILE}" >> $GITHUB_ENV

      - name: upload to our repository
        if: env.SKIP != 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.MIRROR_TAG }}
          name: ${{ env.MIRROR_NAME }}
          body_path: ${{ env.MIRROR_BODY_FILE }}
          files: downloads/*
          token: ${{ secrets.GH_PAT }}
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: send telegram
        if: env.SKIP != 'true'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          MIRROR_API="https://api.github.com/repos/${{ github.repository }}/releases/tags/${MIRROR_TAG}"
          curl -s -H "Authorization: token ${{ secrets.GH_PAT }}" "$MIRROR_API" > mirror_rel.json
          
          assets=""
          jq -r '.assets[] | .name + "|" + .browser_download_url' mirror_rel.json > mirror_assets.txt
          
          while IFS='|' read -r filename download_url; do
            [ -z "$filename" ] && continue
            full_url="${GH_PROXY}${download_url}"
            display_name="$filename"
            case "$filename" in
              *leanback*arm64*)   display_name="📺 TV ARM64版" ;;
              *leanback*armeabi*) display_name="📺 TV ARMeabi版" ;;
              *mobile*v8*)        display_name="📱 安卓版 v8" ;;
              *mobile*v7*)        display_name="📱 安卓版 v7" ;;
              *windows*|*pc*|*.exe) display_name="🪟 Windows 客户端" ;;
              *macos*|*darwin*)   display_name="🍎 macOS 客户端" ;;
              *universal*)        display_name="📦 通用版" ;;
              *x86*|*x64*)        display_name="💻 电脑 x86/x64版" ;;
            esac
            assets="${assets}- [${display_name}](${full_url})"$'\n'
          done < mirror_assets.txt

          [ -z "$assets" ] && assets="无匹配过滤规则的安装包"

          {
            echo "📦下载资产（本仓库镜像）："
            echo -e "${assets}"
            echo ""
            echo "📝更新日志："
            echo '```'
            jq -r '.body // ""' rel.json | head -c 1000
            echo '```'
          } >> "$MSG_FILE_PATH"

          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" \
            -d "parse_mode=Markdown" \
            -d "disable_web_page_preview=true" \
            --data-urlencode "text@${MSG_FILE_PATH}" \
            -w "\nTG 响应码: %{http_code}\n"

      - name: save tag artifact
        if: env.SKIP != 'true'
        run: |
          SAFE_REPO_NAME=$(echo "$FULL_REPO" | tr '/' '_')
          echo "${UPSTREAM_TAG}" > "last_tag_${SAFE_REPO_NAME}.txt"
          
      - name: upload tag artifact
        if: env.SKIP != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tag-${{ strategy.job-index }}
          path: last_tag_*.txt
          retention-days: 1

  # 第三步：汇总并提交状态文件（终极稳定版）
  commit-tags:
    needs: check-release
    # 只有在确实有任务生成了 artifact 时才运行
    if: always() && needs.check-release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: tag-*
          merge-multiple: true

      - name: commit new tags
        run: |
          git config --global user.name "release-bot"
          git config --global user.email "bot@example.com"
          
          if [ -n "$(git status --porcelain)" ]; then
            echo "发现更新，准备提交..."
            git add -A
            # 排除临时文件
            git reset HEAD rel.json releases.json mirror_rel.json 2>/dev/null || true
            git commit -m "update tags [skip ci]"
            git push
          else
            echo "无更新，无需提交。"
          fi
