
name: Github Release Monitor -> Telegram
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: # 手动触发

env:
  # 在这里配置你要监控的仓库列表，支持不同作者，支持无限添加
  # 格式：作者/仓库名
  WATCH_LIST: |
    [
      "Silent1566/webhtv"
    ]
    
  SKIP_PRERELEASE: "false"
  ALLOW_EXT: ".apk,.exe,.zip,.AppImage"

jobs:
  check-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install jq
        run: sudo apt update && sudo apt install -y jq

      - name: fetch and check releases
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          GH_TOKEN="${{ secrets.GH_PAT }}"
          if [ -n "$GH_TOKEN" ]; then
            HEADER=(-H "Authorization: token $GH_TOKEN")
          else
            HEADER=()
          fi

          # 使用 jq 解析 JSON 数组，逐行读取 "作者/仓库"
          echo "$WATCH_LIST" | jq -r '.[]' | while read -r FULL_REPO; do
            [ -z "$FULL_REPO" ] && continue
            
            echo "========================================="
            echo "🔍 正在检查仓库: ${FULL_REPO}"
            
            API_URL="https://api.github.com/repos/${FULL_REPO}/releases"
            curl -s "${HEADER[@]}" "$API_URL" > releases.json

            # 校验 API
            if ! jq -e 'type == "array"' releases.json >/dev/null 2>&1; then
              echo "❌ ${FULL_REPO} 的 API 返回异常（可能不存在或被限流）"
              continue
            fi

            # 提取最新的符合要求的 Release
            if [ "$SKIP_PRERELEASE" = "true" ]; then
              jq '[.[] | select(.prerelease == false)] | .[0]' releases.json > rel.json
            else
              jq '.[0]' releases.json > rel.json
            fi
            
            tag=$(jq -r '.tag_name // empty' rel.json)
            if [ -z "$tag" ] || [ "$tag" = "null" ]; then
              echo "⚠️ ${FULL_REPO} 没有找到符合条件的 Release"
              continue
            fi

            # 将 "作者/仓库" 中的 "/" 替换为 "_" 生成文件名
            SAFE_REPO_NAME=$(echo "$FULL_REPO" | tr '/' '_')
            LAST_TAG_FILE="last_tag_${SAFE_REPO_NAME}.txt"

            if [ -f "$LAST_TAG_FILE" ]; then
              LAST_TAG=$(cat "$LAST_TAG_FILE")
            else
              LAST_TAG=""
            fi

            # 对比
            if [ "$tag" = "$LAST_TAG" ]; then
              echo "⏭️ ${FULL_REPO} 版本未更新 (当前: $tag)，跳过。"
              continue
            fi

            echo "🚀 ${FULL_REPO} 发现新版本: $tag (上次: ${LAST_TAG:-无})"

            # ================= 组装并发送 Telegram =================
            name=$(jq -r '.name // .tag_name' rel.json)
            url=$(jq -r '.html_url' rel.json)
            body=$(jq -r '.body // ""' rel.json | head -c 1000)

            IFS=',' read -ra exts <<< "$ALLOW_EXT"
            filter=""
            for e in "${exts[@]}"; do
              if [ -z "$filter" ]; then
                filter="endswith(\"$e\")"
              else
                filter="$filter or endswith(\"$e\")"
              fi
            done

            assets=$(jq -r --arg filter "$filter" \
              '.assets[] | select(.name | $filter) | "- [" + .name + "](" + .browser_download_url + ")"' \
              rel.json | head -5)
            [ -z "$assets" ] && assets="无匹配过滤规则的安装包"

            MSG_FILE=$(mktemp)
            {
              echo "*🚀发现新版本 Release*"
              echo "仓库：\`${FULL_REPO}\`"
              echo "版本：\`${tag}\`"
              echo "标题：${name}"
              echo "[查看Release页面](${url})"
              echo ""
              echo "📦匹配资产："
              echo "${assets}"
              echo ""
              echo "📝更新日志："
              echo '```'
              echo "${body}"
              echo '```'
            } > "$MSG_FILE"

            # 1. 先发一条文本消息（说明）
            echo "发送更新通知至 Telegram..."
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TG_CHAT_ID}" \
              -d "parse_mode=Markdown" \
              -d "disable_web_page_preview=true" \
              --data-urlencode "text@${MSG_FILE}" \
              -w "\nTelegram 消息 HTTP 响应码: %{http_code}\n"
            
            # 2. 下载安装包并发送文件
            # 提取第一个匹配的下载链接
            DOWNLOAD_URL=$(jq -r --arg filter "$filter" '.assets[] | select(.name | $filter) | .browser_download_url' rel.json | head -1)
            
            if [ -n "$DOWNLOAD_URL" ]; then
              ASSET_NAME=$(basename "$DOWNLOAD_URL")
              echo "正在下载安装包: $ASSET_NAME ..."
              
              # 使用 gh-proxy 加速下载
              curl -L -s "https://gh-proxy.com/${DOWNLOAD_URL}" -o "$ASSET_NAME"
              
              # 检查文件大小 (Telegram Bot API 限制 50MB)
              FILE_SIZE=$(stat -c%s "$ASSET_NAME")
              if [ "$FILE_SIZE" -gt 52428800 ]; then
                echo "❌ 文件大于 50MB，Bot 无法发送，跳过文件发送。"
              else
                echo "发送文件至 Telegram..."
                curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument" \
                  -F "chat_id=${TG_CHAT_ID}" \
                  -F "document=@${ASSET_NAME}" \
                  -F "caption=🚀 ${FULL_REPO} 版本: ${tag}" \
                  -w "\nTelegram 文件 HTTP 响应码: %{http_code}\n"
              fi
            fi

            # 更新状态文件
            echo "$tag" > "$LAST_TAG_FILE"
          done

      - name: commit new tags
        run: |
          git config --global user.name "release-bot"
          git config --global user.email "bot@example.com"
          
          # 检查是否有文件变动
          if [ -n "$(git status --porcelain)" ]; then
            echo "发现新更新的文件，准备提交..."
            git add last_tag_*.txt
            git commit -m "update last tags [skip ci]"
            git push
          else
            echo "没有新版本更新，无需提交。"
          fi
          
