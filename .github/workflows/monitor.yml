name: Github Release Monitor -> Telegram
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          WATCH_LIST='["Silent1566/webhtv", "Silent1566/webhtv-pc","webhtv/webhtv"]'
          echo "matrix={\"repo\":$WATCH_LIST}" >> $GITHUB_OUTPUT

  check-release:
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    env:
      FULL_REPO: ${{ matrix.repo }}
      SKIP_PRERELEASE: "false"
      ALLOW_EXT: ".apk,.exe,.zip,.AppImage"
      GH_PROXY: "https://gh-proxy.com/"
      GH_TOKEN: ${{ secrets.GH_PAT }}
      MAX_UPLOAD_MB: "50"
    steps:
      - name: checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: install jq + coreutils (for vercmp)
        run: sudo apt update && sudo apt install -y jq coreutils

      - name: fetch upstream release
        run: |
          # TG Markdown 转义函数
          tg_escape() {
            echo "$1" | sed -e 's/[_*\[`\]~]/\\&/g'
          }

          echo "========================================="
          echo "🔍 正在检查仓库: ${FULL_REPO}"
          API_URL="https://api.github.com/repos/${FULL_REPO}/releases"
          curl -s -H "Authorization: token $GH_TOKEN" "$API_URL" > releases.json

          if ! jq -e 'type == "array"' releases.json >/dev/null 2>&1; then
            echo "❌ ${FULL_REPO} API 返回异常"
            echo "SKIP=true" >> $GITHUB_ENV
            exit 0
          fi

          if [ "$SKIP_PRERELEASE" = "true" ]; then
            jq '[.[] | select(.prerelease == false)] | .[0]' releases.json > rel.json
          else
            jq '.[0]' releases.json > rel.json
          fi

          tag=$(jq -r '.tag_name // empty' rel.json)
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "⚠️ ${FULL_REPO} 无 Release"
            echo "SKIP=true" >> $GITHUB_ENV
            exit 0
          fi

          SAFE_REPO_NAME=$(echo "$FULL_REPO" | tr '/' '_')
          LAST_TAG_FILE="last_tag_${SAFE_REPO_NAME}.txt"

          LAST_TAG=""
          if [ -f "$LAST_TAG_FILE" ]; then
            LAST_TAG=$(cat "$LAST_TAG_FILE")
          fi

          echo "📌 上次记录版本: $LAST_TAG"
          echo "📌 当前上游版本: $tag"

          # 版本完全相同，直接跳过
          if [ "$tag" = "$LAST_TAG" ]; then
            echo "⏭️ 版本完全一致，跳过：$tag"
            echo "SKIP=true" >> $GITHUB_ENV
            exit 0
          fi

          # 语义版本比较，去除前缀v
          strip_v() {
            echo "$1" | sed 's/^v//'
          }
          VER_CUR=$(strip_v "$tag")
          VER_LAST=$(strip_v "$LAST_TAG")

          # vercmp: 0相等，1新的更大，2旧的更大
          if [ -n "$VER_LAST" ]; then
            if vercmp "$VER_CUR" "$VER_LAST" -eq 2; then
              echo "⏭️ 上游版本 $tag 旧于上次记录 $LAST_TAG，判定为回滚，跳过"
              echo "SKIP=true" >> $GITHUB_ENV
              exit 0
            fi
            if vercmp "$VER_CUR" "$VER_LAST" -eq 0; then
              echo "⏭️ 去除v后版本一致，跳过"
              echo "SKIP=true" >> $GITHUB_ENV
              exit 0
            fi
          fi

          echo "🚀 检测到新版本: $tag"
          echo "SKIP=false" >> $GITHUB_ENV
          echo "UPSTREAM_TAG=${tag}" >> $GITHUB_ENV
          SAFE_TAG=$(echo "${FULL_REPO##*/}-${tag}" | tr '/' '-')
          echo "MIRROR_TAG=${SAFE_TAG}" >> $GITHUB_ENV
          echo "MIRROR_NAME=[镜像] ${FULL_REPO} ${tag}" >> $GITHUB_ENV

          # 导出转义函数给后面步骤
          echo 'TG_ESCAPE_FUNC=tg_escape() { echo "$1" | sed -e '\''s/[_*\[`\]~]/\\&/g'\''; }' >> $GITHUB_ENV

      - name: download assets
        if: env.SKIP != 'true'
        run: |
          # 加载转义函数
          eval "${TG_ESCAPE_FUNC}"

          ORIGINAL_BODY=$(jq -r '.body // ""' rel.json)
          {
            echo "## 镜像来源"
            echo "- **上游仓库**: [${FULL_REPO}](https://github.com/${FULL_REPO})"
            echo "- **上游版本**: \`${UPSTREAM_TAG}\`"
            echo ""
            echo "---"
            echo ""
            echo "$ORIGINAL_BODY"
          } > mirror_body.md
          echo "MIRROR_BODY_FILE=mirror_body.md" >> $GITHUB_ENV

          IFS=',' read -ra exts <<< "$ALLOW_EXT"
          filter=""
          for e in "${exts[@]}"; do
            if [ -z "$filter" ]; then
              filter="endswith(\"$e\")"
            else
              filter="$filter or endswith(\"$e\")"
            fi
          done

          mkdir -p downloads
          # 两个清单：
          #   upload_files.txt —— 小于阈值的文件（需上传镜像 Release）
          #   link_only.txt    —— 大于等于阈值的文件（name|original_url，只发直链）
          : > upload_files.txt
          : > link_only.txt

          jq -r --arg filter "$filter" \
            '.assets[] | select((.name | $filter) and (.name | test("\\.(json|txt|md)$"; "i") | not)) | .browser_download_url' \
            rel.json > dl_links.txt

          download_success=false
          while read -r dl_url; do
            [ -z "$dl_url" ] && continue
            filename=$(basename "$dl_url")
            echo "⬇️ 下载 $filename"
            curl -L -s -o "downloads/$filename" "${GH_PROXY}${dl_url}"

            if [ ! -f "downloads/$filename" ]; then
              continue
            fi
            download_success=true

            # 计算大小（字节 → MB，向上取整）
            size_bytes=$(stat -c%s "downloads/$filename")
            size_mb=$(( (size_bytes + 1024*1024 - 1) / (1024*1024) ))

            if [ "$size_mb" -lt "$MAX_UPLOAD_MB" ]; then
              echo "  ✅ 大小 ${size_mb}MB < ${MAX_UPLOAD_MB}MB，加入上传列表"
              echo "downloads/$filename" >> upload_files.txt
            else
              echo "  📎 大小 ${size_mb}MB ≥ ${MAX_UPLOAD_MB}MB，仅发原始链接"
              echo "${filename}|${dl_url}" >> link_only.txt
              rm -f "downloads/$filename"
            fi
          done < dl_links.txt

          find downloads/ -type f \( -name "*.json" -o -name "*.txt" -o -name "*.md" \) -delete

          upload_count=$(wc -l < upload_files.txt | tr -d ' ')
          link_count=$(wc -l < link_only.txt   | tr -d ' ')
          echo "📊 待上传文件数: ${upload_count}，仅链接文件数: ${link_count}"

          if [ "$download_success" = "false" ] || \
             { [ "$upload_count" -eq 0 ] && [ "$link_count" -eq 0 ]; }; then
            echo "⚠️ 没有匹配的安装包，跳过"
            echo "SKIP=true" >> $GITHUB_ENV
            exit 0
          fi

          # 若全部超限，则不创建镜像 Release，仅发 TG
          if [ "$upload_count" -eq 0 ]; then
            echo "ℹ️ 所有资产均超限，将跳过 GitHub Release，仅发送 Telegram"
            echo "NO_UPLOAD=true" >> $GITHUB_ENV
          else
            echo "NO_UPLOAD=false" >> $GITHUB_ENV
          fi

          name=$(jq -r '.name // .tag_name' rel.json)
          url=$(jq -r '.html_url' rel.json)
          MSG_FILE=$(mktemp)
          {
            echo "*🚀发现新版本 Release*"
            echo "仓库：\`${FULL_REPO}\`"
            echo "版本：\`${UPSTREAM_TAG}\`"
            echo "标题：${name}"
            echo "[查看原Release页面](${url})"
            echo ""
          } > "$MSG_FILE"
          echo "MSG_FILE_PATH=${MSG_FILE}" >> $GITHUB_ENV

      - name: prepare upload file list
        if: env.SKIP != 'true' && env.NO_UPLOAD != 'true'
        run: |
          {
            echo "UPLOAD_FILES_LIST<<EOF"
            cat upload_files.txt
            echo "EOF"
          } >> $GITHUB_ENV

      - name: create mirror release
        if: env.SKIP != 'true' && env.NO_UPLOAD != 'true'
        continue-on-error: true
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.MIRROR_TAG }}
          name: ${{ env.MIRROR_NAME }}
          body_path: ${{ env.MIRROR_BODY_FILE }}
          files: ${{ env.UPLOAD_FILES_LIST }}
          token: ${{ secrets.GH_PAT }}
          fail_on_unmatched_files: false
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: send telegram notify
        if: env.SKIP != 'true'
        continue-on-error: true
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          # 加载转义函数
          tg_escape() {
            echo "$1" | sed -e 's/[_*\[`\]~]/\\&/g'
          }

          # 文件名 → 友好显示名
          friendly_name() {
            local filename="$1"
            case "$filename" in
              *leanback*arm64*)      echo "📺 TV ARM64版" ;;
              *leanback*armeabi*)    echo "📺 TV ARMeabi版" ;;
              *mobile*v8*)           echo "📱 安卓版 v8" ;;
              *mobile*v7*)           echo "📱 安卓版 v7" ;;
              *windows*|*pc*|*.exe)  echo "🪟 Windows 客户端" ;;
              *macos*|*darwin*)      echo "🍎 macOS 客户端" ;;
              *universal*)           echo "📦 通用版" ;;
              *x86*|*x64*)           echo "💻 电脑 x86/x64版" ;;
              *)                     echo "$filename" ;;
            esac
          }

          assets=""

          # ---- 3.1 已上传到镜像仓库的资产 ----
          if [ "$NO_UPLOAD" != "true" ]; then
            MIRROR_API="https://api.github.com/repos/${{ github.repository }}/releases/tags/${MIRROR_TAG}"
            curl -s -H "Authorization: token $GH_TOKEN" "$MIRROR_API" > mirror_rel.json
            jq -r '.assets[] | .name + "|" + .browser_download_url' mirror_rel.json > mirror_assets.txt 2>/dev/null || : > mirror_assets.txt
            if [ -s mirror_assets.txt ]; then
              while IFS='|' read -r filename download_url; do
                [ -z "$filename" ] && continue
                full_url="${GH_PROXY}${download_url}"
                display_name=$(friendly_name "$filename")
                assets="${assets}- [${display_name}](${full_url})  \`(镜像)\`"$'\n'
              done < mirror_assets.txt
            fi
          fi

          # ---- 3.2 超限仅链接资产（原始上游下载 URL）----
          if [ -s link_only.txt ]; then
            while IFS='|' read -r filename dl_url; do
              [ -z "$filename" ] && continue
              full_url="${GH_PROXY}${dl_url}"
              display_name=$(friendly_name "$filename")
              assets="${assets}- [${display_name}](${full_url})  \`(直链, 超过${MAX_UPLOAD_MB}MB未镜像)\`"$'\n'
            done < link_only.txt
          fi

          [ -z "$assets" ] && assets="无匹配过滤规则的安装包"

          RAW_BODY=$(jq -r '.body // ""' rel.json)
          # 截断后转义，防止TG markdown报错
          CUT_BODY_RAW=$(echo "$RAW_BODY" | head -c 900)
          CUT_BODY=$(tg_escape "$CUT_BODY_RAW")

          {
            echo "📦下载资产："
            echo -e "${assets}"
            echo ""
            echo "📝更新日志："
            echo '```'
            echo "$CUT_BODY"
            echo '```'
          } >> "$MSG_FILE_PATH"

          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" \
            -d "parse_mode=Markdown" \
            -d "disable_web_page_preview=true" \
            --data-urlencode "text@${MSG_FILE_PATH}" \
            -w "\nTG HTTP_CODE: %{http_code}\n"

      - name: save & commit last tag
        if: env.SKIP != 'true'
        run: |
          SAFE_REPO_NAME=$(echo "$FULL_REPO" | tr '/' '_')
          LAST_TAG_FILE="last_tag_${SAFE_REPO_NAME}.txt"
          echo "${UPSTREAM_TAG}" > "$LAST_TAG_FILE"

          git config --global user.name "release-bot"
          git config --global user.email "bot@example.com"

          for i in {1..3}; do
            git add "$LAST_TAG_FILE"
            git commit -m "update tag: ${FULL_REPO} -> ${UPSTREAM_TAG} [skip ci]" || true
            if git push; then
              echo "✅ 版本记录提交成功"
              break
            else
              echo "⚠️ push冲突，尝试拉取合并重试 $i/3"
              git pull --rebase
              sleep 2
            fi
          done
