name: Github Release Monitor -> Telegram
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: # 手动触发

env:
  TARGET_OWNER: "Silent1566"
  TARGET_REPO: "webhtv"
  SKIP_PRERELEASE: "true"
  GH_PROXY: "https://gh-proxy.com/"
  ALLOW_EXT: ".apk,.exe,.zip,.AppImage"

jobs:
  check-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install jq
        run: sudo apt update && sudo apt install -y jq

      - name: fetch latest release
        id: fetch_rel
        run: |
          GH_TOKEN=${{ secrets.GH_PAT }}
          API_URL="${GH_PROXY}https://api.github.com/repos/${TARGET_OWNER}/${TARGET_REPO}/releases"
          if [ -n "$GH_TOKEN" ]; then
            HEADER="-H Authorization:token $GH_TOKEN"
          else
            HEADER=""
          fi
          rel=$(curl -s $HEADER "$API_URL" | jq 'map(select( (.prerelease == false) or ("'$SKIP_PRERELEASE'" == "false") )) | .[0]')
          tag=$(echo $rel | jq -r '.tag_name')
          if [ "$tag" = "null" ];then
            echo "没有找到release"
            exit 0
          fi
          echo "TAG=$tag" >> $GITHUB_ENV
          echo "REL_JSON=$rel" >> $GITHUB_ENV

      - name: read last saved tag
        id: read_last
        run: |
          if [ -f last_tag.txt ];then
            last=$(cat last_tag.txt)
          else
            last=""
          fi
          echo "LAST_TAG=$last" >> $GITHUB_ENV

      - name: compare and send telegram
        if: env.TAG != env.LAST_TAG
        run: |
          rel='${{ env.REL_JSON }}'
          tag=$(echo $rel | jq -r '.tag_name')
          name=$(echo $rel | jq -r '.name')
          url=$(echo $rel | jq -r '.html_url')
          body=$(echo $rel | jq -r '.body' | head -c 1200)

          IFS=',' read -ra exts <<< "$ALLOW_EXT"
          filter=""
          for e in "${exts[@]}"; do
            if [ -z "$filter" ]; then
              filter="endswith(\"$e\")"
            else
              filter="$filter or endswith(\"$e\")"
            fi
          done
          assets=$(echo $rel | jq -r --arg filter "$filter" '.assets[] | select(.name | $filter) | "- [" + .name + "](" + .browser_download_url + ")"' | head -5)
          if [ -z "$assets" ]; then
            assets="无匹配过滤规则的安装包"
          fi

          # ✅ 改用Markdown语法，没有< >，YAML不会报错！
          MSG="*🚀发现新版本 Release*
仓库：\`${TARGET_OWNER}/${TARGET_REPO}\`
版本：\`${tag}\`
标题：${name}
[查看Release页面](${url})

📦匹配资产：
${assets}

📝更新日志：
\`\`\`
${body}
\`\`\`"

          curl -s -X POST https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TG_CHAT_ID }} \
            -d parse_mode=Markdown \
            -d disable_web_page_preview=true \
            --data-urlencode text="$MSG"

          echo $tag > last_tag.txt

      - name: commit new tag
        if: env.TAG != env.LAST_TAG
        run: |
          git config --global user.name "release-bot"
          git config --global user.email "bot@example.com"
          git add last_tag.txt
          git commit -m "update last tag: ${{ env.TAG }}"
          git push
